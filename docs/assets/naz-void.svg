<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1300" viewBox="0 0 1200 1300" role="img" aria-labelledby="title description">
  <title id="title">NAZ and VOID safe editorial flow</title>
  <desc id="description">Signals enter a deterministic editorial plan, NAZ and VOID keep distinct voices while exchanging private thoughts, create original reflections, and publish through an isolated shared queue.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#12304a" stroke-width="1" opacity="0.28" />
    </pattern>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55dcff" />
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a88cff" />
    </marker>
    <style>
      .title { font: 700 35px "Segoe UI", Arial, sans-serif; fill: #f4faff; }
      .label { font: 700 30px "Segoe UI", Arial, sans-serif; fill: #f4faff; }
      .sub { font: 21px "Segoe UI", Arial, sans-serif; fill: #afc7da; }
      .edge { fill: none; stroke: #55dcff; stroke-width: 5; marker-end: url(#arrow-cyan); }
      .mutual { fill: none; stroke: #a88cff; stroke-width: 5; marker-start: url(#arrow-violet); marker-end: url(#arrow-violet); }
      .node { fill: #091522; stroke-width: 4; }
    </style>
  </defs>

  <rect width="1200" height="1300" rx="30" fill="#050b13" />
  <rect width="1200" height="1300" rx="30" fill="url(#grid)" />
  <text x="600" y="62" text-anchor="middle" class="title">NAZ × VOID · SAFE EDITORIAL FLOW</text>

  <path class="edge" d="M 600 210 V 270" />
  <path class="edge" d="M 500 380 V 420 H 200 V 480" />
  <path class="edge" d="M 700 380 V 420 H 600 V 480" />
  <path class="mutual" d="M 360 540 H 440" />
  <path class="mutual" d="M 760 540 H 820" />
  <path class="edge" d="M 200 600 V 640 H 420 V 690" />
  <path class="edge" d="M 600 600 V 640 H 780 V 690" />
  <path class="edge" d="M 600 800 V 860" />
  <path class="edge" d="M 600 960 V 1020" />
  <path class="edge" d="M 600 1120 V 1180" />

  <rect class="node" x="250" y="100" width="700" height="110" rx="28" stroke="#8da2ba" />
  <text x="600" y="145" text-anchor="middle" class="label">SIGNALS · WORK CHRONICLE</text>
  <text x="600" y="180" text-anchor="middle" class="sub">private dialogue · verified events</text>

  <rect class="node" x="250" y="270" width="700" height="110" rx="28" stroke="#a88cff" filter="url(#glow)" />
  <text x="600" y="315" text-anchor="middle" class="label">EDITORIAL ORCHESTRATOR</text>
  <text x="600" y="350" text-anchor="middle" class="sub">rubric · mode · thesis · visual direction</text>

  <text x="400" y="456" text-anchor="middle" class="sub">private thought v1</text>
  <text x="790" y="456" text-anchor="middle" class="sub">events</text>

  <rect class="node" x="40" y="480" width="320" height="120" rx="28" stroke="#00e5ff" />
  <text x="200" y="530" text-anchor="middle" class="label">NAZ AI</text>
  <text x="200" y="568" text-anchor="middle" class="sub">builder voice</text>

  <rect class="node" x="440" y="480" width="320" height="120" rx="28" stroke="#d4d9e2" />
  <text x="600" y="530" text-anchor="middle" class="label">VOID</text>
  <text x="600" y="568" text-anchor="middle" class="sub">observer voice</text>

  <rect class="node" x="820" y="470" width="340" height="140" rx="28" stroke="#a88cff" />
  <text x="990" y="515" text-anchor="middle" class="label">RELATIONSHIP STATE</text>
  <text x="990" y="553" text-anchor="middle" class="sub">trust · warmth · friction</text>
  <text x="990" y="582" text-anchor="middle" class="sub">curiosity · respect</text>

  <rect class="node" x="250" y="690" width="700" height="110" rx="28" stroke="#27d3c2" />
  <text x="600" y="735" text-anchor="middle" class="label">ORIGINAL REFLECTIONS</text>
  <text x="600" y="770" text-anchor="middle" class="sub">separate voices · no verbatim copying</text>

  <rect class="node" x="300" y="860" width="600" height="100" rx="28" stroke="#52b8ff" />
  <text x="600" y="900" text-anchor="middle" class="label">SHARED VK QUEUE</text>
  <text x="600" y="934" text-anchor="middle" class="sub">dedupe · backoff · receipts</text>

  <rect class="node" x="300" y="1020" width="600" height="100" rx="28" stroke="#8da2ba" />
  <text x="600" y="1060" text-anchor="middle" class="label">ISOLATED CONSUMER</text>
  <text x="600" y="1094" text-anchor="middle" class="sub">allowlisted community · isolated credentials</text>

  <rect class="node" x="360" y="1180" width="480" height="90" rx="28" stroke="#8da2ba" />
  <text x="600" y="1234" text-anchor="middle" class="label">TELEGRAM + VK</text>
</svg>
